<div style="position: relative; width: 1462px; height: 675px; overflow: hidden; background: #0f1120"><img src="cur-phone.jpg" style="position: absolute; left: 0; top: 0; width: 1462px; height: 675px; display: block"><div class="abs note" style="left: 560px; top: 50px; width: 330px; z-index: 60"><b>①</b> 点灯した人形6体はここ＝紙の帯の付箋。3枚見えて残りは「+3 …」。<b>盤面のどこにも人形はいない</b></div><svg class="abs" style="left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 60" width="1" height="1"><line x1="560" y1="100" x2="440" y2="150" stroke="#9c3a2a" stroke-width="2.5" stroke-dasharray="6 4"></line><circle cx="440" cy="150" r="5" fill="#9c3a2a"></circle></svg><div class="abs note" style="left: 560px; top: 215px; width: 300px; z-index: 60"><b>②</b> ひなたと敵の間の道は空いている。「灯列」「行列」と名の付く札を出しても列は現れない</div><svg class="abs" style="left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 60" width="1" height="1"><line x1="700" y1="260" x2="620" y2="300" stroke="#9c3a2a" stroke-width="2.5" stroke-dasharray="6 4"></line><circle cx="620" cy="300" r="5" fill="#9c3a2a"></circle></svg><div class="abs note" style="left: 1060px; top: 560px; width: 380px; z-index: 60"><b>③</b> 犬の人形・剣の人形の攻撃は、敵の上に数字だけが出る＝<b>誰が殴ったか</b>が絵に無い。盾・回復も同じ (ひなたに数字が出るだけ)</div><svg class="abs" style="left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 60" width="1" height="1"><line x1="1200" y1="560" x2="1000" y2="330" stroke="#9c3a2a" stroke-width="2.5" stroke-dasharray="6 4"></line><circle cx="1000" cy="330" r="5" fill="#9c3a2a"></circle></svg><div class="abs note" style="left: 30px; top: 500px; width: 280px; z-index: 60"><b>④</b> 敵の「人形壊し」(destroy-token) は付箋が1枚消えるだけ。ホードの「数」の気持ちよさも、壊される痛みも見えない</div><div class="abs cap" style="left: 24px; top: 648px; z-index: 60">現状 (スマホ 1462×675・ひなた・人形6体＋灯り増し・探り屋の三人組)。人形＝置物の付箋</div></div></x-dc>
