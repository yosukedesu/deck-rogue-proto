<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent}
/* 題のロゴ: 1600×440 (画面では 0.5〜0.6 倍で出す = なめらかな字) */
#logo{position:relative;width:1600px;height:440px;overflow:hidden}
.yomi-unused{position:absolute;left:0;top:28px;width:100%;text-align:center;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:46px;letter-spacing:.5em;text-indent:.5em;color:#f4ecd6;text-shadow:0 0 2px #130d06,0 0 2px #130d06,0 3px 0 #130d06,0 0 18px rgba(0,0,0,.8)}
.en{position:absolute;left:0;top:34px;width:100%;text-align:center;font-family:'Cinzel',serif;font-weight:900;font-size:206px;line-height:1;letter-spacing:.05em;text-indent:.05em;white-space:nowrap}
.en span{position:relative;display:inline-block;color:transparent}
.en span::before{content:attr(data-t);position:absolute;left:0;top:0;-webkit-text-stroke:14px #130d06;color:#130d06;text-shadow:0 8px 0 #130d06,0 0 30px rgba(0,0,0,.9)}
.en span::after{content:attr(data-t);position:absolute;left:0;top:0;background:linear-gradient(180deg,#fff2c2 0%,#ead08a 28%,#d4aa4e 52%,#a87a2a 74%,#7a5218 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{position:absolute;left:300px;right:300px;top:290px;height:2px;background:linear-gradient(90deg,transparent,#c99a3a 18%,#ead08a 50%,#c99a3a 82%,transparent)}
.rule i{position:absolute;left:50%;top:-7px;width:16px;height:16px;margin-left:-8px;background:#ead08a;transform:rotate(45deg);box-shadow:0 0 10px rgba(234,208,138,.9)}
.sub{position:absolute;left:0;top:318px;width:100%;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:70px;line-height:1;letter-spacing:.22em;text-indent:.22em;white-space:nowrap;color:#f4ecd6;text-shadow:0 0 2px #130d06,0 0 2px #130d06,0 0 3px #130d06,0 5px 0 #130d06,0 0 22px rgba(0,0,0,.85)}
.sub small{font-size:44px;letter-spacing:.3em;color:#e6dcc6;vertical-align:8px}
/* 歯車の紋: 1120×1120 の線画 (画面では α を落として回す) */
#gear{position:relative;width:1120px;height:1120px}
</style></head>
<body>
<div id="logo">
  <div class="en"><span data-t="GEARWITCH">GEARWITCH</span></div>
  <div class="rule"><i></i></div>
  <div class="sub"><small>OF THE</small> NIGHTSHAFT</div>
</div>
<svg id="gear" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#ead08a" stroke-width="0.55">
    <rect x="19.5" y="1" width="5" height="42" rx="0.8"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(30 22 22)"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(60 22 22)"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(90 22 22)"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(120 22 22)"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(150 22 22)"/>
    <circle cx="22" cy="22" r="15.5"/>
    <circle cx="22" cy="22" r="9"/>
    <circle cx="22" cy="22" r="3"/>
    <line x1="22" y1="13" x2="22" y2="6.5"/><line x1="22" y1="31" x2="22" y2="37.5"/>
    <line x1="13" y1="22" x2="6.5" y2="22"/><line x1="31" y1="22" x2="37.5" y2="22"/>
  </g>
</svg>
</body></html>
