<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent}
/* 題のロゴ 案 1「オクトパストラベラー風」(2026-10-29 ユーザー裁定): 薄い金の明朝の大文字・細い二重の枠と角の印・上に小さな紋・下の段は間を広く。1600×440 (画面では 1000 幅 = 0.625 倍) */
#logo{position:relative;width:1600px;height:440px;overflow:hidden}
#logo .frame{position:absolute;left:200px;top:24px;width:1200px;height:392px;border:1.5px solid rgba(234,208,138,.6);box-sizing:border-box}
#logo .frame2{position:absolute;left:207px;top:31px;width:1186px;height:378px;border:1.5px solid rgba(234,208,138,.36);box-sizing:border-box}
#logo .corner{position:absolute;width:26px;height:26px;border:1.5px solid rgba(234,208,138,.95);box-sizing:border-box}
#logo .t1{position:absolute;left:0;top:106px;width:100%;text-align:center;line-height:1;white-space:nowrap;font-family:'Cinzel',serif;font-weight:600;font-size:150px;letter-spacing:.12em;text-indent:.12em;color:#e9d7a6;text-shadow:0 0 1px #e9d7a6,0 3px 0 #2a1d08,0 0 26px rgba(0,0,0,.8)}
#logo .t2{position:absolute;left:0;top:290px;width:100%;text-align:center;line-height:1;white-space:nowrap;font-family:'Cinzel',serif;font-weight:500;font-size:40px;letter-spacing:.62em;text-indent:.62em;color:#d9c8a0;text-shadow:0 2px 0 #2a1d08,0 0 14px rgba(0,0,0,.8)}
#logo .ln{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(234,208,138,.9),transparent)}
/* 歯車の紋: 1120×1120 の線画 (画面では α を落として回す) */
#gear{position:relative;width:1120px;height:1120px}
</style></head>
<body>
<div id="logo">
  <div class="frame"></div><div class="frame2"></div>
  <div class="corner" style="left:188px;top:12px;border-right:0;border-bottom:0"></div><div class="corner" style="left:1386px;top:12px;border-left:0;border-bottom:0"></div><div class="corner" style="left:188px;top:402px;border-right:0;border-top:0"></div><div class="corner" style="left:1386px;top:402px;border-left:0;border-top:0"></div>
  <svg style="position:absolute;left:764px;top:42px" width="72" height="72" viewBox="0 0 44 44"><g fill="none" stroke="#e9d7a6" stroke-width="1.1"><rect x="19.5" y="1" width="5" height="42" rx="0.8"/><rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(45 22 22)"/><rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(90 22 22)"/><rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(135 22 22)"/><circle cx="22" cy="22" r="13"/><circle cx="22" cy="22" r="4" fill="#e9d7a6"/></g></svg>
  <div class="ln" style="left:270px;width:470px;top:78px"></div><div class="ln" style="left:860px;width:470px;top:78px"></div>
  <div class="t1">GEARWITCH</div>
  <div class="ln" style="left:270px;width:300px;top:310px"></div><div class="ln" style="left:1030px;width:300px;top:310px"></div>
  <div class="t2">OF THE NIGHTSHAFT</div>
</div>
<svg id="gear" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#ead08a" stroke-width="0.55">
    <rect x="19.5" y="1" width="5" height="42" rx="0.8"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(30 22 22)"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(60 22 22)"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(90 22 22)"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(120 22 22)"/>
    <rect x="19.5" y="1" width="5" height="42" rx="0.8" transform="rotate(150 22 22)"/>
    <circle cx="22" cy="22" r="15.5"/>
    <circle cx="22" cy="22" r="9"/>
    <circle cx="22" cy="22" r="3"/>
    <line x1="22" y1="13" x2="22" y2="6.5"/><line x1="22" y1="31" x2="22" y2="37.5"/>
    <line x1="13" y1="22" x2="6.5" y2="22"/><line x1="31" y1="22" x2="37.5" y2="22"/>
  </g>
</svg>
</body></html>
